<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1410">
  <title>Archery Scoreboard</title>
  <meta name="description" content="Live UK archery scoreboard for 1st Hillsborough, Lisburn Cathedral and Dagger Road.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArcheryScore">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="default">
  <div class="bg-target" aria-hidden="true">
    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="98"/><circle cx="100" cy="100" r="78"/><circle cx="100" cy="100" r="58"/><circle cx="100" cy="100" r="38"/><circle cx="100" cy="100" r="18"/></svg>
  </div>

  <header class="top">
    <a class="brand" href="#" id="brand">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#f4f4f0"/><circle cx="50" cy="50" r="36" fill="#1b1b1b"/><circle cx="50" cy="50" r="24" fill="#2b79c2"/><circle cx="50" cy="50" r="14" fill="#e03131"/><circle cx="50" cy="50" r="6" fill="#ffd43b"/></svg>
      <span>Archery<b>Score</b></span>
    </a>
    <div class="who" id="who" hidden></div>
    <button class="link" id="fs" type="button" hidden aria-label="Full screen">⛶ Full screen</button>
  </header>

  <main id="app"></main>
  <footer class="ver" id="ver"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="rounds.js"></script>
  <script src="qr.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
